<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPA Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="text-center mb-2">GPA Calculator</h1>
    <p class="text-center text-muted mb-4">
      Enter your subjects, marks and credit hours — the GPA is calculated
      with JavaScript functions and conditionals.
    </p>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label" for="subject">Subject</label>
            <input type="text" id="subject" class="form-control" placeholder="e.g. Web Engineering">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="marks">Marks (0–100)</label>
            <input type="number" id="marks" class="form-control" min="0" max="100" placeholder="85">
          </div>
          <div class="col-md-3">
            <label class="form-label" for="credits">Credit hours</label>
            <input type="number" id="credits" class="form-control" min="1" max="6" value="3">
          </div>
          <div class="col-md-2">
            <button id="add-btn" class="btn btn-primary w-100">Add subject</button>
          </div>
        </div>
        <p id="error" class="text-danger mt-3 mb-0"></p>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Subject</th>
            <th>Marks</th>
            <th>Grade</th>
            <th>Grade points</th>
            <th>Credit hours</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="subject-rows"></tbody>
      </table>
    </div>
    <p id="empty-note" class="text-muted text-center">No subjects added yet.</p>

    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mt-4">
      <button id="clear-btn" class="btn btn-outline-secondary">Clear all</button>
      <h2 class="mb-0">GPA: <span id="gpa-result">—</span></h2>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
